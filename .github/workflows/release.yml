# Builds the Windows and macOS downloads for the rolling latest release.
#
# The toolchain matches the local build exactly: WinLibs GCC 16.2.0 (UCRT,
# posix-seh, r3) and JUCE 8.0.6 with ci/juce-8.0.6-mingw.patch, both pinned by
# SHA-256. The patch is the same one the local JUCE checkout under
# ../SightLine/.tools carries, so CI and local builds compile the same JUCE.

name: Release latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push gets released; an older build still running is cancelled.
concurrency:
  group: release-latest
  cancel-in-progress: true

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip
  WINLIBS_SHA256: 3c69305081e4a647144339a936244fcf7d3d9e558319e1ad7be2cd2886d4b6a1
  JUCE_URL: https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip
  JUCE_SHA256: 89e32f3d989d43e87bec3bac82bb6ea19e58d96b14853c41a8151071598ba613

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain and JUCE
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: tools-${{ env.WINLIBS_SHA256 }}-${{ env.JUCE_SHA256 }}-${{ hashFiles('ci/juce-8.0.6-mingw.patch') }}

      - name: Download toolchain and JUCE
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"

          curl -fsSL -o mingw.zip "$WINLIBS_URL"
          echo "$WINLIBS_SHA256  mingw.zip" | sha256sum -c -
          7z x -y -bso0 mingw.zip
          rm mingw.zip

          curl -fsSL -o juce.zip "$JUCE_URL"
          echo "$JUCE_SHA256  juce.zip" | sha256sum -c -
          7z x -y -bso0 juce.zip
          rm juce.zip

          cd JUCE-8.0.6
          git apply --verbose --ignore-whitespace "$GITHUB_WORKSPACE/ci/juce-8.0.6-mingw.patch"

      - name: Configure
        run: |
          set -euo pipefail
          tools="$(cygpath -m "$RUNNER_TEMP/tools")"
          workspace="$(cygpath -m "$GITHUB_WORKSPACE")"
          export PATH="$(cygpath -u "$tools/mingw64/bin"):$PATH"
          # The patched juceaide reads this to embed a Common Controls v6 manifest.
          export SIGHTLINE_MANIFEST_RC="$workspace/Source/platform/win_manifest.rc"
          # juceaide is configured by a nested CMake run that only inherits the
          # environment, so the force-includes have to be exported as well.
          # Same flags as build.sh.
          export CXXFLAGS="-include utility -include cstring -include cstdint -include cstdio -include $workspace/Source/platform/mingw_uia_shim.h -static"
          unset RC
          gcc --version | head -1

          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$tools/mingw64/bin/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$tools/mingw64/bin/c++.exe" \
            -DCMAKE_RC_COMPILER="$tools/mingw64/bin/windres.exe" \
            -DCMAKE_MAKE_PROGRAM="$tools/mingw64/bin/mingw32-make.exe" \
            -DVX_JUCE_DIR="$tools/JUCE-8.0.6" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS"

      - name: Build
        run: |
          set -euo pipefail
          tools="$(cygpath -m "$RUNNER_TEMP/tools")"
          export PATH="$(cygpath -u "$tools/mingw64/bin"):$PATH"
          cmake --build build --target Voxline_VST3 Voxline_Standalone VoxlineTests VoxlineSmoke -j 4

      # A release is only published when the DSP checks and the plugin/editor
      # smoke checks (every preset complete, every parameter reachable, every
      # preset renders under the ceiling) pass.
      - name: Test
        run: |
          set -euo pipefail
          ./build/VoxlineTests.exe
          ./build/VoxlineSmoke.exe

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
                                "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
                                  "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Package
        run: |
          set -euo pipefail
          out=build/Voxline_artefacts/Release
          mkdir -p dist
          (cd "$out/VST3" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/voxline-VST3-Windows.zip" voxline.vst3)
          iscc="$(cygpath -u "$ISCC")"
          "$iscc" installer/voxline.iss
          ls -la dist

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/voxline-Setup-Windows.exe
            dist/voxline-VST3-Windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      JUCE_MACOS_SHA256: 89e32f3d989d43e87bec3bac82bb6ea19e58d96b14853c41a8151071598ba613
    steps:
      - uses: actions/checkout@v4
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/JUCE-8.0.6
          key: juce-macos-${{ env.JUCE_MACOS_SHA256 }}
      - name: Download JUCE 8.0.6
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o juce.zip https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip
          echo "$JUCE_MACOS_SHA256  juce.zip" | shasum -a 256 -c -
          unzip -q juce.zip
          rm juce.zip
      - name: Run DSP tests
        run: VX_JUCE_DIR="$RUNNER_TEMP/JUCE-8.0.6" bash build-macos.sh tests 4
      - name: Build and package macOS bundles
        run: VX_JUCE_DIR="$RUNNER_TEMP/JUCE-8.0.6" bash build-macos.sh build 4
      - name: Check Audio Unit metadata
        run: |
          set -euo pipefail
          plist=dist/voxline.component/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist")" = 'aufx'
          test "$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist")" = 'Vxln'
          test "$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist")" = 'Cdbx'
      - name: Upload macOS downloads
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/voxline-macOS.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect Windows downloads
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - name: Collect macOS downloads
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: dist
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          {
            echo "Built automatically from \`$short\` on \`main\`: $(git log -1 --format=%s)"
            echo
            echo "- **voxline-Setup-Windows.exe**: installs the standalone app and \`voxline.vst3\` into \`C:\\Program Files\\Common Files\\VST3\`."
            echo "- **voxline-VST3-Windows.zip**: the VST3 bundle on its own; unzip into \`C:\\Program Files\\Common Files\\VST3\`."
            echo "- **voxline-macOS.zip** contains the VST3, Audio Unit, and standalone app for Apple Silicon and Intel. Install the .component in ~/Library/Audio/Plug-Ins/Components for Logic Pro and GarageBand."
            echo
            echo "This release is replaced on every push to \`main\`."
          } > notes.md

          # Drop the previous release and its tag, then recreate both on this commit.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "latest" \
            --notes-file notes.md \
            --latest \
            dist/voxline-Setup-Windows.exe \
            dist/voxline-VST3-Windows.zip \
            dist/voxline-macOS.zip
